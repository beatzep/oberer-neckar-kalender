name: Aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"
    # Am Wochenende stuendlich von 12 bis 22 Uhr UTC: Anwuerfe liegen meist
    # zwischen Sa 18 Uhr und So 18 Uhr, das Spiel dauert etwa 1:45h und der
    # Verband traegt das Ergebnis erst danach ein. Uebernommen aus dem
    # MuRu-Projekt (handball-kalender/.github/workflows/spielplan.yml).
    - cron: "5 12-22 * * 6,0"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten holen und Seite bauen
        run: |
          python3 hole_daten.py --teams teams.json --out daten.json
          python3 baue_ics.py --daten daten.json --out-verzeichnis docs
          python3 baue_seite.py --daten daten.json --out docs/index.html

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daten.json docs/
          git diff --staged --quiet || git commit -m "Automatische Aktualisierung"
          git push
