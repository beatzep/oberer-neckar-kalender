name: Aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"
    # Am Wochenende stuendlich von 12 bis 22 Uhr UTC: Anwuerfe liegen meist
    # zwischen Sa 18 Uhr und So 18 Uhr, das Spiel dauert etwa 1:45h und der
    # Verband traegt das Ergebnis erst danach ein. Uebernommen aus dem
    # MuRu-Projekt (handball-kalender/.github/workflows/spielplan.yml).
    - cron: "5 12-22 * * 6,0"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

# Setzt zusaetzlich voraus, dass unter Settings > Actions > General >
# Workflow permissions "Read and write permissions" aktiviert ist - sonst
# schlaegt der Commit-Schritt fehl, bevor ueberhaupt ein Job startet.

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten holen und Seite bauen
        run: |
          W="https://oberer-neckar-zaehler.edis-herrmann.workers.dev"
          python3 hole_daten.py --teams teams.json --out daten.json
          python3 baue_ics.py --daten daten.json --out-verzeichnis docs
          python3 baue_seite.py --daten daten.json --out docs/index.html --worker-url "$W"
          python3 baue_admin.py --worker-url "$W" --out docs/admin.html

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daten.json docs/
          git diff --staged --quiet || git commit -m "Automatische Aktualisierung"
          git push

      # Kein stiller Fehler mehr: sobald keine Mannschaft mehr ein offenes
      # Spiel hat, legt der Workflow ein Issue an - GitHub schickt dem
      # Repo-Owner dafuer von sich aus eine Mail. Schliesst sich von selbst
      # wieder, sobald teams.json auf die neue Saison zeigt und wieder
      # Spiele da sind.
      - name: Saisonende melden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ABGESCHLOSSEN=$(python3 -c "import json; print(json.load(open('daten.json')).get('saison_abgeschlossen', False))")
          SAISON=$(python3 -c "import json; print(json.load(open('daten.json'))['saison'])")
          OFFEN=$(gh issue list --search "\"Saison zu Ende\" in:title" --state open --json number --jq '.[0].number // empty')

          if [ "$ABGESCHLOSSEN" = "True" ]; then
            if [ -z "$OFFEN" ]; then
              gh issue create --title "Saison $SAISON zu Ende - IDs fuer die naechste Saison pflegen" \
                --body "Alle drei Mannschaften haben ihr letztes Saisonspiel dieser Saison gespielt.

                Neue og/cl/ct-IDs fuer teams.json auf handball4all nachsehen (README, Abschnitt \"Die Quelle ist eine andere\": ueber \"Kalender abonnieren\" auf der handball4all-Seite, Rechtsklick auf den iCal-Link, URL kopieren) und \`saison\` in teams.json auf den neuen Wert setzen.

                hole_daten.py archiviert die alte Saison beim naechsten Lauf automatisch unter docs/archiv/ und schaltet sie im Saison-Dropdown auf der Seite frei. Dieses Issue schliesst sich von selbst, sobald wieder Spiele da sind."
            fi
          else
            if [ -n "$OFFEN" ]; then
              gh issue close "$OFFEN" --comment "Neue Spiele sind da - die IDs sind offenbar gepflegt."
            fi
          fi
